<div class="flex flex-col items-center">
  <h1 class="text-2xl font-medium text-zinc-600">{{ name() }}</h1>
  <div class="flex justify-center gap-x-4 pt-2">
    <div class="flex flex-col items-center">
      <span class="text-green-500 text-lg font-medium">Peso (kg)</span>
      <input
        type="number"
        placeholder="Ex. 70"
        class="border-2 border-gray-300 p-1 rounded-lg"
        [(ngModel)]="peso"
        name="peso"
      />
    </div>
    <div class="flex flex-col items-center">
      <span class="text-green-500 text-lg font-medium">Altura (cm)</span>
      <input
        type="number"
        placeholder="Ex. 170"
        class="border-2 border-gray-300 p-1 rounded-lg"
        [(ngModel)]="altura"
        name="altura"
      />
    </div>
  </div>
  <div class="pt-4">
    <button
      (click)="calcularImc()"
      class="bg-green-500 text-white font-medium text-2xl w-100 rounded-lg py-1 cursor-pointer hover:bg-green-300 duration-400"
    >
      Calcular
    </button>
  </div>
  <div class="pt-5">
    <div
      class="w-100 h-35 bg-white border-2 border-gray-300 rounded-xl px-4 py-2 flex flex-col gap-y-1"
    >
      <span class="text-lg font-medium text-gray-600"
        >Seu IMC é: {{ resultado() === 0 ? '-' : resultado() }}</span
      >
      <div class="flex items-start pt-8 duration-150">
        <div
          class="relative w-30 bg-amber-300 h-2 rounded-l-xl border-2 border-amber-500 flex justify-center"
        >
          @if (resultado() > 0 && resultado() < 18.5) {
          <div class="absolute -top-1.5 w-1 h-4 bg-gray-500 shadow-sm"></div>
          }
          <span class="font-medium text-amber-500 text-sm pt-2">Abaixo do peso</span>
        </div>

        <div class="relative w-30 bg-green-600 h-2 border-2 border-green-700 flex justify-center">
          @if (resultado() >= 18.5 && resultado() < 25) {
          <div class="absolute -top-1.5 w-1 h-4 bg-gray-800 shadow-sm"></div>
          }
          <span class="font-medium text-green-700 text-sm pt-2">Normal</span>
        </div>

        <div
          class="relative w-30 bg-orange-600 h-2 rounded-r-xl border-2 border-orange-700 flex justify-center"
        >
          @if (resultado() >= 25) {
          <div class="absolute -top-1.5 w-1 h-4 bg-gray-800 shadow-sm"></div>
          }
          <span class="font-medium text-orange-700 text-sm pt-2">Acima do peso</span>
        </div>
      </div>
    </div>
  </div>
</div>
