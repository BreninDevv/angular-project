<div class="flex flex-col items-center">
  <h1 class="md:text-xl lg:text-2xl xl:text-2xl sm:text-lg text-sm font-medium text-zinc-600">
    {{ name() }}
  </h1>
  <div class="flex justify-center gap-x-4 xl:pt-2 lg:pt-2 md:pt-0 sm:pt-0 pt-0">
    <div class="flex flex-col items-center">
      <span class="text-green-500 xl:text-lg lg:text-lg md:text-lg sm:text-sm text-sm font-medium"
        >Peso (kg)</span
      >
      <input
        type="number"
        placeholder="Ex. 70"
        class="border-2 border-gray-300 p-1 rounded-lg sm:w-40 md:w-full xl:w-full lg:w-full w-30"
        [(ngModel)]="peso"
        name="peso"
      />
    </div>
    <div class="flex flex-col items-center">
      <span class="text-green-500 xl:text-lg lg:text-lg md:text-lg sm:text-sm font-medium text-sm"
        >Altura (cm)</span
      >
      <input
        type="number"
        placeholder="Ex. 170"
        class="border-2 border-gray-300 p-1 rounded-lg sm:w-35 md:w-full xl:w-full lg:w-full w-30"
        [(ngModel)]="altura"
        name="altura"
      />
    </div>
  </div>
  <div class="md:pt-2 sm:pt-1 pt-1">
    <button
      (click)="calcularImc()"
      class="bg-green-500 text-white font-medium xl:text-2xl lg:text-2xl md:text-2xl sm:text-lg xl:w-100 lg:w-100 md:w-100 sm:w-80 w-63.5 rounded-lg py-1 md:py-0 cursor-pointer hover:bg-green-300 duration-400"
    >
      Calcular
    </button>
  </div>
  <div class="pt-2 md:pt-2 lg:pt-5 sm:pt-1">
    <div
      class="xl:h-40 lg:h-30 md:h-22 sm:h-20 sm:w-80 xl:w-100 lg:w-100 md:w-100 h-21 w-65 bg-white border-2 border-gray-300 rounded-xl px-4 py-2 flex flex-col gap-y-1"
    >
      <span class="xl:text-lg lg:text-lg md:text-lg sm:text-sm font-medium text-gray-600"
        >Seu IMC é: {{ resultado() === 0 ? '-' : resultado() }}</span
      >
      <div class="flex items-start pt-2 md:py-2 lg:pt-8 sm:py-1 duration-150">
        <div
          class="relative w-30 bg-amber-300 h-2 rounded-l-xl border-2 border-amber-500 flex justify-center"
        >
          @if (resultado() > 0 && resultado() < 18.5) {
          <div class="absolute -top-1.5 w-1 h-4 bg-gray-500 shadow-sm"></div>
          }
          <span class="font-medium text-amber-500 text-sm pt-2">Abaixo</span>
        </div>

        <div class="relative w-30 bg-green-600 h-2 border-2 border-green-700 flex justify-center">
          @if (resultado() >= 18.5 && resultado() < 25) {
          <div class="absolute -top-1.5 w-1 h-4 bg-gray-800 shadow-sm"></div>
          }
          <span class="font-medium text-green-700 text-sm pt-2">Normal</span>
        </div>

        <div
          class="relative w-30 bg-orange-600 h-2 rounded-r-xl border-2 border-orange-700 flex justify-center"
        >
          @if (resultado() >= 25) {
          <div class="absolute -top-1.5 w-1 h-4 bg-gray-800 shadow-sm"></div>
          }
          <span class="font-medium text-orange-700 text-sm pt-2">Acima</span>
        </div>
      </div>
    </div>
  </div>
</div>
